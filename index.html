<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emirates - Fly Better</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <nav class="nav">
        <div class="nav-container">
            <div class="logo">
                <img src="logo.png" alt="Emirates Logo">
            </div>
            <div class="nav-links">
                <a href="#">BOOK</a>
                <a href="#">MANAGE</a>
                <a href="#">EXPERIENCE</a>
                <a href="#">WHERE WE FLY</a>
                <a href="#">LOYALTY</a>
                <a href="#">HELP</a>
            </div>
            <div class="social-links">
                <a href="#" aria-label="Discord"><i data-lucide="message-circle"></i></a>
                <a href="#" aria-label="Twitter"><i data-lucide="twitter"></i></a>
                <a href="#" aria-label="Roblox"><i data-lucide="gamepad"></i></a>
                <a href="#" aria-label="YouTube"><i data-lucide="youtube"></i></a>
            </div>
        </div>
    </nav>

    <section class="hero">
        <div class="hero-content">
            <h1 class="hero-title">Fly to Dubai and get</h1>
            <h2 class="hero-subtitle">FREE TICKETS</h2>
            <p class="hero-description">to top attractions</p>
            <button class="book-btn" onclick="window.location.href='https://www.roblox.com/games/125757968444921/Flights-Calendar';">Book now</button>
        </div>
    </section>

    <section class="search-section">
        <div class="search-container">
            <div class="search-tabs">
                <button class="tab active">
                    <i data-lucide="plane"></i>
                    Flight
                </button>
                <button class="tab">
                    <i data-lucide="hotel"></i>
                    Flight + Hotel
                </button>
            </div>

            <form class="search-form">
                <div class="form-group">
                    <label class="form-label">Departure Airport</label>
                    <i data-lucide="map-pin" class="form-icon"></i>
                    <input type="text" class="form-input" placeholder="Enter city or airport">
                </div>
                <div class="form-group">
                    <label class="form-label">Arrival Airport</label>
                    <i data-lucide="map-pin" class="form-icon"></i>
                    <input type="text" class="form-input" placeholder="Enter city or airport">
                </div>
                <div class="form-group">
                    <label class="form-label">Travel Dates</label>
                    <i data-lucide="calendar" class="form-icon"></i>
                    <input type="date" class="form-input" placeholder="Select dates">
                </div>
            </form>

            <button class="book-btn search-btn" onclick="window.location.href='https://www.roblox.com/games/125757968444921/Flights-Calendar';">
                Search Flights
                <i data-lucide="search"></i>
            </button>
        </div>
    </section>

    <section class="services">
        <div class="services-grid">
            <div class="service-item">
                <i data-lucide="car" class="w-12 h-12"></i>
                <h3 class="service-title">Car rentals</h3>
            </div>
            <div class="service-item">
                <i data-lucide="map-pin" class="w-12 h-12"></i>
                <h3 class="service-title">Tours & activities</h3>
            </div>
            <div class="service-item">
                <i data-lucide="users" class="w-12 h-12"></i>
                <h3 class="service-title">Book a holiday</h3>
            </div>
            <div class="service-item">
                <i data-lucide="clock" class="w-12 h-12"></i>
                <h3 class="service-title">Airport transfers</h3>
            </div>
        </div>
    </section>

    <section class="loyalty-banner">
        <div class="loyalty-container">
            <div class="loyalty-content">
                <h3 class="loyalty-title">Join Emirates Skywards</h3>
                <p class="loyalty-description">Earn miles with our loyalty program and enjoy exclusive benefits</p>
            </div>
            <button class="book-btn">Join now</button>
        </div>
    </section>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();
    </script>
</body>
</html>
